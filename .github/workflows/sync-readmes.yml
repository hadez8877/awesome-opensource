name: Sync READMEs

on:
  push:
    branches:
      - main
    paths:
      - README.md

permissions: {}

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required by stefanzweifel/git-auto-commit-action to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0

      - name: Run OpenCode
        uses: sst/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "*": "deny",
                "read": "allow",
                "edit": "allow",
                "glob": "allow",
                "task": "allow"
              }
            }
        with:
          model: opencode/gemini-3.5-flash
          prompt: |
            Update README.md files to match the latest English README changes.

            Requirements:
            1. Update all relevant locale READMEs under README.<locale>.md so they reflect these English README changes.
            2. You MUST use the Task tool for translation work and launch subagents with subagent_type `translator` (Use the skill `translate`).
            3. Do not translate directly in the primary agent. Use translator subagent output as the source for locale text updates.
            4. Run translator subagent Task calls in parallel whenever file/locale translation work is independent.
            5. Use only the minimum tools needed for this task (read/glob, file edits, and translator Task). Do not use shell, web, search, or GitHub tools for translation work.
            6. Preserve frontmatter keys, internal links, code blocks, and existing locale-specific metadata unless the English change requires an update.
            7. Keep locale docs structure aligned with their corresponding English pages.
            8. Do not modify original English source file.
            9. If no locale updates are needed, make no changes.

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: '[ci] readme'
          branch: ${{ github.head_ref }}
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: ${{ github.event.commits[0].author.name }} <${{ github.actor }}@users.noreply.github.com>
